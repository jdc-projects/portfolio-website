name: Deploy Production
on:
  push:
    branches: ["trunk"]
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 1 *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Repo checkout
        uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 26.4.0
          cache: npm
      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: |
            ./.next/cache
          key: ${{ runner.os }}-github-pages-${{ hashFiles('./package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-github-pages-${{ hashFiles('./package-lock.json') }}-
      - name: Install dependencies
        run: npm ci
      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
        run: npm run build
      - name: Inject & upload source maps to PostHog
        # Uploads source maps so error-tracking stack traces are readable.
        # Skips silently if upload secrets are absent; never blocks deploys.
        continue-on-error: true
        uses: PostHog/upload-source-maps@v2
        with:
          directory: ./out
          project-id: ${{ secrets.POSTHOG_PROJECT_ID }}
          api-key: ${{ secrets.POSTHOG_CLI_API_KEY }}
          host: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
      - name: Archive artifact
        run: |
          echo ::group::Archive artifact
          tar \
            --dereference --hard-dereference \
            --directory ./out \
            -cvf "$RUNNER_TEMP/github-pages.tar" \
            --exclude=.git \
            --exclude=.github \
            .
          echo ::endgroup::
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/github-pages.tar
          retention-days: 1
          if-no-files-found: error

  playwright-tests:
    needs: build
    runs-on: self-hosted

    steps:
      - name: Repo checkout
        uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 26.4.0
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps
      - name: Run Playwright tests
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          npm run test
      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  deploy:
    needs: [build, playwright-tests]
    runs-on: self-hosted

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
